<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1444 · 版图挑战</title><meta name="description" content="在1444年神罗及周边84国的无字地图上定位国家，支持10国挑战和地图清空。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101d26'/%3E%3Cpath d='M16 3 20 12 29 16 20 20 16 29 12 20 3 16 12 12Z' fill='%23d9b77a'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><span class="compass">✥</span><div><b>1444</b><span>版图挑战</span></div></div><div class="edition">神罗与周边 · 84 国专项</div><button id="sound" aria-pressed="true">音效：开</button><button id="restart">重新开始</button></header>
<main><section class="command"><div class="question"><span id="eyebrow">准备探索</span><h1 id="target">神罗小国，你认识多少？</h1><p id="message" role="status" aria-live="polite">只考浅色区域；深灰色地区不进入题库。</p></div><div class="metrics"><div><span>题目</span><b id="round">— / 10</b></div><div><span>答对</span><b id="score">0</b></div><div><span>正确率</span><b id="accuracy">—</b></div><div class="clock"><span>剩余时间</span><b id="time">20<span>秒</span></b></div><div class="elapsed-live"><span>总耗时</span><b id="liveElapsed">0分00秒</b></div></div></section>
<div class="time-track"><div id="progress"></div></div>
<section class="map-shell"><div id="viewport"><div id="map"><img src="europe.svg" alt="1444年神罗及指定周边国家无字地图；浅色国家为题库，深灰色地区不出题" draggable="false"><svg id="overlay" viewBox="0 0 2048 1152" aria-label="地图点击区域"><g id="reveal"></g><circle id="pin" r="8" display="none"/></svg></div></div>
<div class="map-tools"><button id="zoomOut" aria-label="缩小地图">−</button><span id="zoom">100%</span><button id="zoomIn" aria-label="放大地图">＋</button><button id="fit">复位</button></div><div class="map-hint">滚轮缩放 · 拖动地图 · 点击作答</div>
<div id="startPanel" class="panel"><div class="panel-inner"><span class="kicker">THE WORLD IN 1444</span><h2>从一座城，认出一个国家</h2><label for="mode">游戏模式</label><select id="mode"><option value="challenge">10 国挑战</option><option value="clear">地图清空 · 全部 84 国</option></select><p id="modeHelp">随机抽取 10 个不同国家，适合短时练习。</p><label for="duration">每题限时</label><select id="duration"><option value="0">不限时</option><option value="10">10 秒 · 挑战</option><option value="20" selected>20 秒 · 标准</option><option value="30">30 秒 · 从容</option></select><button id="start" class="primary">开始挑战 <span>→</span></button><small id="coverage"></small></div></div>
<div id="resultPanel" class="panel" hidden><div class="panel-inner"><span class="kicker">CHALLENGE COMPLETE</span><h2 id="resultTitle">本轮挑战完成</h2><span class="result-label">本局正确率</span><div id="finalScore"></div><div class="elapsed-result"><span>总耗时</span><strong id="totalElapsed">—</strong></div><p id="summary"></p><div id="review"></div><button id="viewMap">查看完成地图</button><button id="again" class="primary">再来一局 ↻</button></div></div></section>
<footer><div class="legend"><span><i class="unanswered"></i>未答</span><span><i class="correct"></i>答对</span><span><i class="incorrect"></i>答错 / 超时</span><span><i class="excluded"></i>不出题</span></div><span id="cleared">已完成 0 / 84</span><span class="next-controls"><button id="next" class="primary" aria-keyshortcuts="Space" aria-describedby="next-shortcut" disabled>下一题 →</button><kbd id="next-shortcut" title="本题结算后按空格进入下一题">空格</kbd></span></footer></main><script src="countries.js"></script><script src="game.js"></script></body></html>
